# ResurgenceStation — Docker Compose
#
# Services: mariadb · tgs (TGStation Server) · statbus (slimbus PHP-FPM) · caddy
#
# Quick start:
#   cp .env.example .env        # fill in MYSQL_ROOT_PASSWORD + MYSQL_PASSWORD
#   docker compose build
#   docker compose up -d
#
# Ports exposed on the host:
#   1337      — BYOND game port (clients connect here)
#   5000      — TGS web panel  (configure instances, watchdog, chat bots)
#   3306      — MariaDB         (optional; for local DB tooling)

services:

  # ── Database ─────────────────────────────────────────────────────────────
  mariadb:
    build:
      context: .
      dockerfile: docker/mariadb/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ss13
      MYSQL_USER: ss13
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── TGStation Server (manages BYOND, hot-swap, watchdog, chat bots) ─────────
  tgs:
    build:
      context: .
      dockerfile: docker/tgs/Dockerfile
    init: true
    restart: unless-stopped
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${GAME_PORT:-1337}:1337/tcp"
      - "${GAME_PORT:-1337}:1337/udp"
      - "5000:5000"
    environment:
      # Password injected at runtime — never stored in the image or this file.
      Database__ConnectionString: "Server=mariadb;Port=3306;Database=tgs;Uid=ss13;Pwd=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env};"
      Database__DatabaseType: MariaDB
      Database__ServerVersion: "10.11.0"
    volumes:
      - ./docker/tgs/appsettings.Production.yml:/config_data/appsettings.Production.yml:ro
      # Static game config bind-mounted into the TGS instance so edits are live.
      - ./config:/tgs_instances/ResurgenceStation/Configuration/GameStaticFiles/config:ro
      - game_data:/tgstation/data
      - tgs_instances:/tgs_instances
      - tgs_logs:/tgs_logs

  # ── Statbus (slimbus PHP-FPM) ─────────────────────────────────────────────
  statbus:
    build:
      context: .
      dockerfile: docker/statbus/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_METHOD: mysql
      DB_DATABASE: ss13
      DB_USERNAME: ss13
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PREFIX: "SS13_"
      ALT_DB_METHOD: mysql
      ALT_DB_DATABASE: statbus
      ALT_DB_USERNAME: ss13
      ALT_DB_PASSWORD: ${MYSQL_PASSWORD}
      ALT_DB_HOST: mariadb
      ALT_DB_PORT: "3306"
      APP: "${STATBUS_APP:-HippieStation Statbus}"
      GITHUB: "${GITHUB:-HippieStation/HippieStation}"
      DEBUG: "FALSE"
      DISPLAY_ERRORS: "FALSE"
    volumes:
      # servers.json tells slimbus which game port(s) to track
      - ./docker/statbus/servers.json:/var/www/html/src/conf/servers.json:ro
      # Game logs mounted read-only so LogsController can read them directly
      - game_data:/tgstation/data:ro

  # ── Webmap tile renderer ──────────────────────────────────────────────────
  #
  # Runs ONCE on `docker-compose up`, writes XYZ tile pyramid to webmap_tiles
  # volume, then exits.  Caddy picks up those tiles at webmap.owo.fm.
  #
  # To force a re-render after a map update:
  #   docker volume rm <project>_webmap_tiles
  #   docker-compose up webmap-renderer
  webmap-renderer:
    build:
      context: .
      dockerfile: docker/webmap/Dockerfile
    restart: "no"
    volumes:
      # Full repo bind-mounted read-only — dmm-tools needs icons + code + DMM
      - .:/src:ro
      # Tile output shared with Caddy
      - webmap_tiles:/tiles

  # ── Demo viewer builder ───────────────────────────────────────────────────
  #
  # Clones ResurgenceStation/demo-viewer, patches it, and builds a static
  # bundle into the demo_viewer_dist volume.  Runs once and exits; Caddy
  # picks up those files at demo.owo.fm.
  #
  # To force a rebuild after upstream changes:
  #   docker-compose build demo-viewer-builder
  #   docker volume rm <project>_demo_viewer_dist
  #   docker-compose up demo-viewer-builder
  demo-viewer-builder:
    build:
      context: .
      dockerfile: docker/demo-viewer/Dockerfile
    restart: "no"
    volumes:
      - demo_viewer_dist:/dist

  # ── Public log parser (scrubs IPs/CIDs/ADMINPRIVATE, hides ongoing rounds) ─
  log-parser:
    image: ghcr.io/resurgencestation/public-log-parser:latest
    restart: unless-stopped
    depends_on:
      - caddy
    volumes:
      - ./docker/log-parser/config.toml:/app/config.toml:ro
      - game_data:/logs:ro

  # ── Caddy (reverse proxy + auto-HTTPS for statbus) ───────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - statbus
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./slimbus/public:/var/www/html/public:ro
      - caddy_data:/data
      - caddy_certs:/config
      # log-parser reads round files from this volume; caddy no longer file_serves it.
      # Pre-rendered map tiles served at webmap.owo.fm
      - webmap_tiles:/srv/webmap:ro
      # Built demo viewer SPA served at demo.owo.fm
      - demo_viewer_dist:/srv/demo-viewer:ro
      # Stub serverinfo.json served on the docker network at :8081 for the
      # parser's ongoing-round-protection. Replaced by a live file from a
      # DMAPI event script in Phase 4.
      - ./docker/log-parser/serverinfo.json:/srv/serverinfo/serverinfo.json:ro

volumes:
  mariadb_data:
  game_data:
  tgs_instances:
  tgs_logs:
  caddy_data:
  caddy_certs:
  webmap_tiles:
  demo_viewer_dist:
