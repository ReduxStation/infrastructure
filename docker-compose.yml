# ReduxStation Docker Compose stack.
# Volume namespace pinned via `name: reduxstation`.
# Secrets live at /etc/redux/secrets/*; Compose mounts them via `secrets:`.
# Non-secret cross-cutting vars come from globals.env (symlinked to .env).
# Host-only secret overrides come from .env.local (gitignored).

name: reduxstation

secrets:
  mysql_root_password:
    file: /etc/redux/secrets/mysql_root_password
  mysql_password:
    file: /etc/redux/secrets/mysql_password

services:
  mariadb:
    build:
      context: ./docker/mariadb
      additional_contexts:
        - "game=../game"
        - "infra=." 
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ss13
      MYSQL_USER: ss13
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  tgs:
    build:
      context: ./docker/tgs
    init: true
    restart: unless-stopped
    cap_add: [SYS_NICE, SYS_RESOURCE]
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "${GAME_PORT:-1337}:1337/tcp"
      - "${GAME_PORT:-1337}:1337/udp"
      - "5000:5000"
    environment:
      # TGS doesn't support _FILE convention; password comes from .env.local
      # via docker-compose env interpolation.
      Database__ConnectionString: "Server=mariadb;Port=3306;Database=tgs;Uid=ss13;Pwd=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.local};"
      Database__DatabaseType: MariaDB
      Database__ServerVersion: "10.11.0"
      LD_LIBRARY_PATH: /tgs_instances/ReduxStation/Game/Live
      # Load EventScripts from /etc/tgs-EventScripts.d/reduxstation/ for all instances
      # — eliminates the per-instance Configuration/EventScripts/ symlink ritual.
      General__AdditionalEventScriptsDirectories__0: /etc/tgs-EventScripts.d/reduxstation
    volumes:
      - ./docker/tgs/appsettings.Production.yml:/config_data/appsettings.Production.yml:ro
      - tgs_instances:/tgs_instances
      - tgs_logs:/tgs_logs
      - /etc/tgs-EventScripts.d/reduxstation:/etc/tgs-EventScripts.d/reduxstation:ro
      - /etc/redux/secrets:/etc/redux/secrets:ro

  statbus:
    build:
      context: .
      dockerfile: docker/statbus/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb: { condition: service_healthy }
    environment:
      DB_METHOD: mysql
      DB_DATABASE: ss13
      DB_USERNAME: ss13
      DB_PASSWORD: ${MYSQL_PASSWORD:?}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_PREFIX: "SS13_"
      ALT_DB_METHOD: mysql
      ALT_DB_DATABASE: statbus
      ALT_DB_USERNAME: ss13
      ALT_DB_PASSWORD: ${MYSQL_PASSWORD:?}
      ALT_DB_HOST: mariadb
      ALT_DB_PORT: "3306"
      APP: "${STATBUS_APP:-ReduxStation Statbus}"
      GITHUB: "${GITHUB:-ReduxStation/ReduxStation}"
      DEBUG: "FALSE"
      DISPLAY_ERRORS: "FALSE"
    volumes:
      - ./docker/statbus/servers.json:/var/www/html/src/conf/servers.json:ro
      - type: volume
        source: tgs_instances
        target: /srv/gamestatic
        read_only: true
        volume:
          subpath: ReduxStation/Configuration/GameStaticFiles/data

  webmap-renderer:
    build:
      context: ./docker/webmap
    restart: "no"
    volumes:
      - ../game:/src:ro          # operator sibling clone of game repo at /srv/redux/game
      - webmap_tiles:/tiles

  webmap-site-builder:
    build:
      context: ./docker/webmap-site
    restart: "no"
    volumes:
      - webmap_site_dist:/dist

  demo-viewer-builder:
    build:
      context: ./docker/demo-viewer
    restart: "no"
    volumes:
      - demo_viewer_dist:/dist

  website-builder:
    build:
      context: ./docker/website
    restart: "no"
    volumes:
      - website_dist:/dist

  log-parser:
    image: ghcr.io/reduxstation/public-log-parser:latest
    restart: unless-stopped
    depends_on: [caddy]
    volumes:
      - ./docker/log-parser/config.toml:/app/config.toml:ro
      - type: volume
        source: tgs_instances
        target: /logs
        read_only: true
        volume:
          subpath: ReduxStation/Configuration/GameStaticFiles/data

  serverinfo-updater:
    build:
      context: ./docker/serverinfo-updater
    restart: unless-stopped
    depends_on: [tgs]
    environment:
      GAME_HOST: tgs
      GAME_PORT: "1337"
      SERVER_IDENTIFIER: ${SERVER_SUBDIR:-owo}
      OUTPUT_PATH: /srv/output/serverinfo.json
      POLL_INTERVAL: "30"
    volumes:
      - type: volume
        source: tgs_instances
        target: /srv/output
        volume:
          subpath: ReduxStation/Configuration/GameStaticFiles/data

  caddy:
    build:
      context: ./docker/caddy
    restart: unless-stopped
    depends_on: [statbus]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./slimbus/public:/var/www/html/public:ro
      - caddy_data:/data
      - caddy_certs:/config
      - type: volume
        source: tgs_instances
        target: /srv/logs
        read_only: true
        volume:
          subpath: ReduxStation/Configuration/GameStaticFiles/data
      - tgs_instances:/srv/tgs:ro
      - webmap_tiles:/srv/tiles:ro
      - webmap_site_dist:/srv/webmap-site:ro
      - demo_viewer_dist:/srv/demo-viewer:ro
      - website_dist:/srv/website:ro

volumes:
  mariadb_data:
    external: true
    name: reduxstation_mariadb_data
  tgs_instances:
    external: true
    name: reduxstation_tgs_instances
  tgs_logs:
    external: true
    name: reduxstation_tgs_logs
  caddy_data:
    external: true
    name: reduxstation_caddy_data
  caddy_certs:
    external: true
    name: reduxstation_caddy_certs
  webmap_tiles:
    external: true
    name: reduxstation_webmap_tiles
  webmap_site_dist:
    external: true
    name: reduxstation_webmap_site_dist
  demo_viewer_dist:
    external: true
    name: reduxstation_demo_viewer_dist
  website_dist:
    external: true
    name: reduxstation_website_dist
